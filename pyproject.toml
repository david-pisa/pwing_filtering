[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pwing_filtering"
version = "1.0.0"
description = "PWING VLF Data Processing and Filtering pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cdflib",
    "numpy",
    "scipy",
    "xarray"
]
